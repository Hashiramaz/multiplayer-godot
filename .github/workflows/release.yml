name: Build & Release

# Toda push na main exporta a build Windows, cria um GitHub Release e (se o segredo
# BUTLER_API_KEY estiver configurado) atualiza o canal windows no itch.io.
# Pushes só de docs/markdown não disparam (economiza minutos de runner).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

# Só uma release por vez; um push novo cancela a anterior em andamento.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # necessário pro softprops criar o Release

env:
  GODOT_VERSION: "4.7.0"
  EXPORT_PRESET: "Windows Desktop"
  EXE_NAME: "EscapeTheIsland.exe"
  ITCH_TARGET: "jappa/escape-the-island:windows"
  # Vazio até você adicionar o segredo -> o passo do itch é pulado com elegância.
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # Import + export num passo só, usando o *_console.exe.
      # O alias `godot` do setup aponta pro exe GUI (subsistema Windows): o PowerShell
      # NÃO espera um app GUI, então o export "voltava" na hora e não gerava nada. O
      # binário _console bloqueia até terminar e ainda imprime a saída (útil se falhar).
      - name: Build (import + export)
        shell: pwsh
        run: |
          # The `godot` alias is a symlink to the GUI-subsystem exe. pwsh won't wait for
          # a GUI app (that was the empty-build bug), so run it via Start-Process -Wait.
          # Pass args as ONE quoted string, not an array: Start-Process splits array
          # elements on spaces, which turned the "Windows Desktop" preset into "Windows".
          $godot = (Get-Command godot).Source
          Write-Host "Godot: $godot"
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          $preset = "${{ env.EXPORT_PRESET }}"
          $exe = "build/windows/${{ env.EXE_NAME }}"
          function Run-Godot($tag, [string]$argline) {
            Write-Host "== $tag :: $argline =="
            $p = Start-Process -FilePath $godot -ArgumentList $argline -Wait -NoNewWindow -PassThru -RedirectStandardOutput "gd_$tag.out" -RedirectStandardError "gd_$tag.err"
            Get-Content "gd_$tag.out","gd_$tag.err" -ErrorAction SilentlyContinue
            Write-Host "$tag exit: $($p.ExitCode)"
          }
          Run-Godot "import" "--headless --import"
          Run-Godot "export" "--headless --export-release `"$preset`" `"$exe`""
          if (-not (Test-Path $exe)) { throw "Export nao gerou o .exe" }
          Write-Host ("OK: {0:N0} bytes" -f (Get-Item $exe).Length)

      - name: Bundle steam_appid.txt + zip
        shell: pwsh
        run: |
          Copy-Item steam_appid.txt build/windows/steam_appid.txt -Force
          Compress-Archive -Path build/windows/* -DestinationPath EscapeTheIsland-windows.zip -Force

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Build automática do commit ${{ github.sha }}."
          files: EscapeTheIsland-windows.zip

      - name: Install butler
        if: ${{ env.BUTLER_API_KEY != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler -Force

      - name: Publish to itch.io
        if: ${{ env.BUTLER_API_KEY != '' }}
        shell: pwsh
        run: butler\butler.exe push build/windows "${{ env.ITCH_TARGET }}"
